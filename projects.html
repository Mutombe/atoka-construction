<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — Atoka Construction</title>
  <meta name="description" content="Residential, commercial, estate and renovation projects built by Atoka Construction across Harare and Zimbabwe.">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" href="assets/img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="projects">
<header class="site-header"></header>
<main>
  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Projects</span></nav>
      <div class="ph-grid">
        <h1 class="display h-xl"><span class="split-line"><span>Projects<span class="dot">.</span></span></span></h1>
        <p class="lead rv" style="margin:0">Homes, estates and commercial buildings we've delivered — and the ones on site right now. Tap any project for the facts.</p>
      </div>
    </div>
  </section>
  <section class="sec-tight" style="padding-top:10px">
    <div class="wrap">
      <div class="sec-head" style="margin-bottom:20px"><div class="tabs" role="tablist" data-proj-tabs></div><p class="muted" style="margin:0;font-size:13px" data-proj-count></p></div>
      <div class="proj-grid" data-proj-grid></div>
    </div>
  </section>
  <section class="sec-tight">
    <div class="wrap">
      <div class="cta-band rv" style="grid-template-columns:1.4fr 1fr;align-items:center">
        <div style="position:relative;z-index:1"><h2 class="display h-md">Your project<br>could be next<span class="dot">.</span></h2><p style="margin:14px 0 0">Get an indicative budget in five minutes, then talk it through with a project manager.</p></div>
        <div style="display:flex;justify-content:flex-end;position:relative;z-index:1"><a class="btn btn-amber btn-lg" href="estimate.html">Start my estimate</a></div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer"></footer>
<div class="modal" id="modal-project" aria-hidden="true"><div class="modal-scrim" data-close></div><div class="modal-box"><button class="icon-btn modal-close" data-close aria-label="Close"></button><div data-project-body></div></div></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  (function () {
    const { $, projectTabs, bindProjects } = window.A;
    const type = new URLSearchParams(location.search).get('type') || 'All';
    projectTabs($('[data-proj-tabs]'), $('[data-proj-grid]'), type);
    const count = () => { $('[data-proj-count]').textContent = $('[data-proj-grid]').querySelectorAll('.proj').length + ' projects'; };
    $('[data-proj-tabs]').addEventListener('click', () => setTimeout(count));
    count();
    bindProjects();
  })();
</script>
</body>
</html>
